appId: ai.ohmygame.desktop
productName: 织女星
asar: true
beforePack: scripts/prepare-desktop-typebox.mjs
asarUnpack:
  - node_modules/esbuild/**/*
  - node_modules/@esbuild/**/*
  - dist/player/**/*

directories:
  output: release

files:
  - build/icon.ico
  - build/icon.png
  - dist/desktop/**/*.js
  - dist/desktop/**/*.cjs
  - dist/daemon/**/*.js
  - dist/shared/**/*.js
  - dist/renderer/**/*
  - dist/player/**/*
  - "!node_modules/typebox/build/**/*.mjs"
  - from: .runtime/typebox
    to: node_modules/typebox/build

extraResources:
  - from: .runtime/capacitor-tools
    to: capacitor-tools
  - from: .runtime/capacitor-tools/node_modules
    to: capacitor-tools/node_modules
    filter:
      - "**/*"
  - from: plugins
    to: plugins
  - from: .runtime/preinstalled-plugins
    to: preinstalled-plugins
  - from: .runtime/examples
    to: examples
  - from: .runtime/node
    to: runtime/node
  - from: .runtime/desktop-config.json
    to: desktop-config.json

mac:
  icon: build/icon.icns
  category: public.app-category.developer-tools
  hardenedRuntime: true
  notarize: true
  target:
    - dmg
    - zip

win:
  executableName: Zhinvxing
  signExecutable: false
  icon: build/icon.ico
  target:
    - nsis
  artifactName: 织女星-${version}-${arch}.${ext}

publish:
  provider: generic
  url: ${env.DESKTOP_UPDATE_URL}
  channel: latest

dmg:
  artifactName: 织女星-${version}-${arch}.${ext}
